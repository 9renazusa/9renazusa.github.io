<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>転星術</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600;700&family=Cinzel:wght@400;700&display=swap');

  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --gold: #c9a84c;
    --deep-purple: #0d0820;
    --mid-purple: #1a1135;
    --accent-purple: #4a2d7a;
    --light-gold: #e8d5a3;
    --pale: #f5f0e8;
    --active-blue: #6D9EEB;
    --root-pale: #C9DAF8;
    --glow: rgba(201,168,76,0.3);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--deep-purple);
    color: var(--pale);
    font-family: 'Noto Serif JP', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Stars background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 40% 8%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 25%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 80% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 45%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 70%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 85%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 75%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 90%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 5% 90%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 50% 50%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 35%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 55%, rgba(255,255,255,0.3) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 56px;
    animation: fadeDown 1s ease both;
  }

  .subtitle {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 18px;
    opacity: 0.9;
  }

  h1 {
    font-size: clamp(28px, 6vw, 48px);
    font-weight: 300;
    letter-spacing: 0.2em;
    color: var(--light-gold);
    line-height: 1.4;
    margin-bottom: 12px;
    text-shadow: 0 0 40px var(--glow);
  }

  .star-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 20px auto;
  }

  .star-divider::before, .star-divider::after {
    content: '';
    flex: 1;
    max-width: 120px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold));
  }
  .star-divider::after {
    background: linear-gradient(to left, transparent, var(--gold));
  }

  .star-symbol { color: var(--gold); font-size: 16px; }

  .lead {
    font-size: 13px;
    line-height: 2;
    color: rgba(245,240,232,0.65);
    max-width: 500px;
    margin: 0 auto;
    letter-spacing: 0.08em;
  }

  /* Input card */
  .input-card {
    background: linear-gradient(135deg, rgba(26,17,53,0.9), rgba(13,8,32,0.95));
    border: 1px solid rgba(201,168,76,0.25);
    border-radius: 4px;
    padding: 40px 40px 44px;
    margin-bottom: 40px;
    box-shadow: 0 0 60px rgba(74,45,122,0.3), inset 0 1px 0 rgba(201,168,76,0.1);
    animation: fadeUp 1s 0.3s ease both;
  }

  .input-label {
    display: block;
    font-size: 12px;
    letter-spacing: 0.25em;
    color: var(--gold);
    text-align: center;
    margin-bottom: 28px;
  }

  .date-selects {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }

  .select-wrap {
    position: relative;
  }

  .select-wrap label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: rgba(201,168,76,0.7);
    text-align: center;
    margin-bottom: 8px;
  }

  select {
    appearance: none;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 2px;
    color: var(--light-gold);
    font-family: 'Noto Serif JP', serif;
    font-size: 16px;
    padding: 10px 36px 10px 16px;
    cursor: pointer;
    transition: border-color 0.3s;
    min-width: 80px;
  }

  select:focus {
    outline: none;
    border-color: var(--gold);
  }

  .select-wrap::after {
    content: '▾';
    position: absolute;
    right: 12px;
    bottom: 11px;
    color: var(--gold);
    pointer-events: none;
    font-size: 12px;
  }

  .btn-divine {
    display: block;
    width: 100%;
    max-width: 280px;
    margin: 0 auto;
    padding: 16px 24px;
    background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(201,168,76,0.08));
    border: 1px solid var(--gold);
    border-radius: 2px;
    color: var(--light-gold);
    font-family: 'Noto Serif JP', serif;
    font-size: 14px;
    letter-spacing: 0.3em;
    cursor: pointer;
    transition: all 0.4s;
    position: relative;
    overflow: hidden;
  }

  .btn-divine::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(201,168,76,0.2), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .btn-divine:hover { 
    box-shadow: 0 0 30px var(--glow);
    letter-spacing: 0.4em;
  }
  .btn-divine:hover::before { opacity: 1; }

  /* Result */
  .result {
    display: none;
    animation: fadeUp 0.8s ease both;
  }

  .result.visible { display: block; }

  .result-header {
    text-align: center;
    margin-bottom: 40px;
  }

  .result-date {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: var(--gold);
    margin-bottom: 8px;
  }

  .result-zodiac {
    font-size: 18px;
    color: var(--light-gold);
    letter-spacing: 0.15em;
    margin-bottom: 4px;
  }

  /* Chakra diagram */
  .chakra-diagram {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin: 40px auto;
    max-width: 320px;
  }

  .chakra-item {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    padding: 14px 20px;
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: 2px;
    background: rgba(255,255,255,0.02);
    transition: all 0.4s;
    position: relative;
  }

  .chakra-item.active-chakra {
    border-color: var(--active-blue);
    background: rgba(109,158,235,0.08);
    box-shadow: 0 0 20px rgba(109,158,235,0.15);
  }

  .chakra-item.main-chakra {
    border-color: rgba(201,201,248,0.5);
    background: rgba(201,218,248,0.06);
    box-shadow: 0 0 20px rgba(201,218,248,0.1);
  }

  .chakra-orb {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .chakra-orb.active { background: radial-gradient(circle, rgba(109,158,235,0.6), rgba(109,158,235,0.2)); border: 1px solid var(--active-blue); }
  .chakra-orb.main { background: radial-gradient(circle, rgba(201,218,248,0.5), rgba(201,218,248,0.15)); border: 1px solid rgba(201,218,248,0.6); }
  .chakra-orb.none { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); }

  .chakra-info { flex: 1; }

  .chakra-planet-name {
    font-size: 17px;
    font-weight: 600;
    color: var(--light-gold);
    letter-spacing: 0.1em;
    margin-bottom: 2px;
  }

  .chakra-type-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: rgba(245,240,232,0.5);
  }

  .chakra-tag {
    font-size: 9px;
    letter-spacing: 0.15em;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
  }

  .tag-active { background: rgba(109,158,235,0.2); color: var(--active-blue); border: 1px solid rgba(109,158,235,0.4); }
  .tag-main { background: rgba(201,218,248,0.15); color: #c9daf8; border: 1px solid rgba(201,218,248,0.4); }

  /* Section cards */
  .section-card {
    background: linear-gradient(135deg, rgba(26,17,53,0.8), rgba(13,8,32,0.9));
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 4px;
    padding: 36px 36px;
    margin-bottom: 24px;
    box-shadow: 0 0 40px rgba(74,45,122,0.2);
  }

  .section-label {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .section-label-icon { font-size: 18px; }

  .section-label-text {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
  }

  .section-title {
    font-size: 20px;
    font-weight: 600;
    color: var(--light-gold);
    letter-spacing: 0.12em;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .section-body {
    font-size: 14px;
    line-height: 2.2;
    color: rgba(245,240,232,0.8);
    letter-spacing: 0.06em;
  }

  .section-body p { margin-bottom: 14px; }
  .section-body p:last-child { margin-bottom: 0; }

  .highlight {
    color: var(--light-gold);
    border-bottom: 1px solid rgba(201,168,76,0.3);
  }

  /* Virtue chips */
  .virtue-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 16px;
  }

  .virtue-chip {
    background: rgba(201,168,76,0.08);
    border: 1px solid rgba(201,168,76,0.25);
    border-radius: 2px;
    padding: 6px 14px;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--light-gold);
  }

  /* Reset button */
  .btn-reset {
    display: block;
    width: 180px;
    margin: 40px auto 0;
    padding: 12px 20px;
    background: transparent;
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 2px;
    color: rgba(245,240,232,0.5);
    font-family: 'Noto Serif JP', serif;
    font-size: 12px;
    letter-spacing: 0.25em;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
  }
  .btn-reset:hover { border-color: var(--gold); color: var(--light-gold); }

  /* Animations */
  @keyframes fadeDown {
    from { opacity:0; transform:translateY(-20px); }
    to { opacity:1; transform:translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(20px); }
    to { opacity:1; transform:translateY(0); }
  }


  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  /* ── 鑑定タブ ── */
  .reading-tabs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin: 48px 0 24px;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    padding: 10px 0;
    background: linear-gradient(to bottom, var(--deep-purple) 75%, transparent);
  }
  .reading-tab {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 2px;
    color: rgba(245,240,232,0.55);
    font-family: 'Noto Serif JP', serif;
    font-size: 13px;
    letter-spacing: 0.12em;
    padding: 12px 4px;
    cursor: pointer;
    transition: color 0.3s, border-color 0.3s, background 0.3s;
  }
  .reading-tab:hover { color: var(--light-gold); }
  .reading-tab.on {
    color: var(--light-gold);
    border-color: var(--gold);
    background: rgba(201,168,76,0.1);
  }
  .reading-tab:focus-visible, .btn-divine:focus-visible, .btn-reset:focus-visible {
    outline: 2px solid var(--light-gold);
    outline-offset: 2px;
  }
  .reading-tab small {
    display: block;
    font-size: 10px;
    letter-spacing: 0.05em;
    margin-top: 4px;
    opacity: 0.7;
  }
  .tab-panel { display: none; }
  .tab-panel.on { display: block; animation: fadeUp 0.5s ease both; }

  .sub-head {
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--gold);
    margin: 22px 0 6px;
  }
  .sub-head:first-child { margin-top: 0; }
  .section-body .sub-head + p { margin-bottom: 8px; }

  .love-list { list-style: none; margin-top: 4px; }
  .love-list li {
    position: relative;
    padding-left: 1.4em;
    margin-bottom: 8px;
  }
  .love-list li::before {
    content: '✦';
    position: absolute;
    left: 0;
    color: var(--gold);
    font-size: 10px;
    top: 0.45em;
  }

  .core-flow {
    border-left: 1px solid rgba(201,168,76,0.4);
    padding-left: 18px;
    margin: 8px 0 16px;
  }
  .core-flow p { margin-bottom: 6px !important; }

  .source-note {
    font-size: 11px;
    line-height: 1.9;
    color: rgba(245,240,232,0.4);
    text-align: center;
    margin-top: 32px;
    letter-spacing: 0.05em;
  }

  @media (max-width: 500px) {
    .reading-tab { font-size: 11px; letter-spacing: 0; padding: 12px 2px; white-space: nowrap; }
    .reading-tab small { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }


  /* ── ツインレイ ── */
  .date-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .date-chip {
    background: rgba(201,168,76,0.08);
    border: 1px solid rgba(201,168,76,0.35);
    color: var(--light-gold);
    font-family: 'Noto Serif JP', serif;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 2px;
    cursor: pointer;
  }
  .date-chip:hover { background: rgba(201,168,76,0.2); }
  .date-chip.self { border-style: dashed; opacity: 0.7; }
  .date-more { font-size: 12px; color: rgba(245,240,232,0.5); align-self: center; }
  .twin-type { border-left: 2px solid var(--tc); }

  .twin-cal {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 14px;
    margin-top: 4px;
  }
  .cal-m { font-size: 12px; color: var(--gold); letter-spacing: 0.15em; margin-bottom: 4px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-d {
    aspect-ratio: 1;
    font-size: 9px;
    border: none;
    border-radius: 2px;
    background: rgba(255,255,255,0.05);
    color: rgba(13,8,32,0.85);
    cursor: pointer;
    padding: 0;
    font-family: 'Noto Serif JP', serif;
  }
  .cal-d:not([style]) { color: rgba(245,240,232,0.35); }
  .cal-d.self { outline: 1px solid #fff; outline-offset: 1px; }
  .cal-d:focus-visible { outline: 2px solid var(--light-gold); }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 16px; font-size: 12px; }
  .cal-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .cal-hint { font-size: 12px !important; color: rgba(245,240,232,0.5); margin-top: 10px; }

  .pair-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .pair-btn {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--light-gold);
    font-family: 'Noto Serif JP', serif;
    font-size: 14px;
    letter-spacing: 0.15em;
    padding: 10px 20px;
    border-radius: 2px;
    cursor: pointer;
  }
  .pair-btn:hover { background: rgba(201,168,76,0.12); }
  .pair-result { margin-top: 18px; }
  .pair-head {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    font-size: 13px; color: var(--light-gold); margin-bottom: 10px;
  }
  .pair-x { color: var(--gold); }
  .pair-type { border-left: 2px solid; padding: 4px 0 4px 14px; margin: 14px 0; }
  .pair-type-name { font-size: 15px; letter-spacing: 0.1em; margin-bottom: 4px; }
  .pair-type-name small { font-size: 11px; margin-left: 8px; opacity: 0.8; }

  /* サイト導線 */
  .site-back {
    display: inline-block;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: rgba(201,168,76,0.7);
    text-decoration: none;
    margin-bottom: 28px;
  }
  .site-back:hover { color: var(--light-gold); }
  a.btn-divine { text-align: center; text-decoration: none; }
  .site-footer { text-align: center; margin-top: 48px; }
  .pair-cta { margin-top: 16px; }
  .pair-cta a { display: inline-block; text-decoration: none; }

  /* ── Xシェア ── */
  .share-bar { text-align: center; margin: 8px 0 32px; }
  .share-btn {
    display: inline-flex; align-items: center; gap: 10px;
    background: #f5f0e8; color: #0d0820;
    border: none; border-radius: 999px;
    font-family: 'Noto Serif JP', serif; font-size: 14px; letter-spacing: 0.1em;
    padding: 11px 24px; cursor: pointer;
  }
  .share-btn:hover { background: #fff; }
  .share-btn:focus-visible { outline: 2px solid var(--light-gold); outline-offset: 3px; }
  .share-x { font-size: 16px; font-weight: 700; }
  .share-note { font-size: 11px; color: rgba(245,240,232,0.45); margin-top: 8px; letter-spacing: 0.05em; }
  .pair-cta p { font-size: 13px; color: rgba(245,240,232,0.7); margin-bottom: 10px; }

  /* ── ツインレイ鍵 ── */
  .lock-form { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .lock-input {
    flex: 1 1 180px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(201,168,76,0.4);
    border-radius: 2px;
    color: var(--cream, #f5f0e8);
    font-family: 'Noto Serif JP', serif;
    font-size: 16px;
    padding: 10px 12px;
  }
  .lock-input:focus { outline: 2px solid var(--light-gold); outline-offset: 1px; }
  .lock-msg { min-height: 1.6em; font-size: 13px !important; color: var(--light-gold); margin-top: 8px; }

  /* Responsive */
  @media (max-width: 500px) {
    .input-card { padding: 28px 20px 32px; }
    .section-card { padding: 24px 20px; }
    .date-selects { gap: 10px; }
    select { font-size: 15px; padding: 9px 32px 9px 12px; }
  }
</style>
</head>
<body>
<div class="container">

  <a class="site-back" href="../">← 9ren / azusa</a>

  <header>
    <div class="subtitle">Reincarnation Astrology</div>
    <h1>転星術</h1>
    <div class="star-divider"><span class="star-symbol">✦</span></div>
    <p class="lead">誕生日から、あなたの魂が前世より受け継いだ<br>天体チャクラの構造を解読し、<br>前世・使命と才能・運命・人間関係を読み解きます</p>
  </header>

  <div class="input-card" id="inputSection">
    <span class="input-label">✦ 誕生日を選択してください ✦</span>
    <div class="date-selects">
      <div class="select-wrap">
        <label>月</label>
        <select id="monthSelect"></select>
      </div>
      <div class="select-wrap">
        <label>日</label>
        <select id="daySelect"></select>
      </div>
    </div>
    <button class="btn-divine" onclick="divine()">天体チャクラを解読する</button>
  </div>

  <div class="result" id="resultSection">
    <div class="result-header">
      <div class="result-date" id="resultDate"></div>
      <div class="result-zodiac" id="resultZodiac"></div>
    </div>

    <div class="chakra-diagram" id="chakraDiagram"></div>

    <div id="resultCards"></div>

    <button class="btn-reset" onclick="reset()">← 別の日付で診断</button>
  </div>

  <div class="site-footer"><a class="site-back" href="../">← 9ren / azusa のトップへ</a></div>

</div>

function getPastVariant(root, active) {
  if (root === '火星') {
    if (active === '水星' || active === '土星') return PAST_VARIANT['火星_知性'];
    return PAST_VARIANT[`火星_${active}`] || '';
  }
  if (root === '土星') {
    if (['水星','月','木星'].includes(active)) return PAST_VARIANT['土星_知性'];
    return PAST_VARIANT[`土星_${active}`] || '';
  }
  return '';
}

// ── セレクトボックス初期化 ─────────────────────────────────────
const months = Array.from({length:12},(_,i)=>i+1);
const monthSelect = document.getElementById('monthSelect');
const daySelect = document.getElementById('daySelect');

months.forEach(m => {
  const opt = document.createElement('option');
  opt.value = String(m).padStart(2,'0');
  opt.textContent = m + '月';
  monthSelect.appendChild(opt);
});

function updateDays() {
  const m = parseInt(monthSelect.value);
  const maxDay = [31,29,31,30,31,30,31,31,30,31,30,31][m-1];
  const prev = daySelect.value;
  daySelect.innerHTML = '';
  for(let d=1;d<=maxDay;d++){
    const opt = document.createElement('option');
    opt.value = String(d).padStart(2,'0');
    opt.textContent = d + '日';
    daySelect.appendChild(opt);
  }
  if(prev && parseInt(prev) <= maxDay) daySelect.value = prev;
}

monthSelect.addEventListener('change', updateDays);
updateDays();

// 今日の日付をデフォルトに
const today = new Date();
monthSelect.value = String(today.getMonth()+1).padStart(2,'0');
updateDays();
daySelect.value = String(today.getDate()).padStart(2,'0');

const TWIN_PW_KEY = 'tenseijutsu-twin-pass';

function b64bytes(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function decryptTwin(pw) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b64bytes(TWIN_LOCK.salt), iterations:TWIN_LOCK.iter, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64bytes(TWIN_LOCK.iv) }, key, b64bytes(TWIN_LOCK.data));
  return new TextDecoder().decode(plain);
}

function twinUnlocked() { return typeof renderTwin === 'function'; }

async function unlockTwin(pw, silent) {
  const msg = document.getElementById('twinLockMsg');
  if (!pw) { if (msg && !silent) msg.textContent = 'パスワードを入力してください'; return false; }
  if (msg && !silent) msg.textContent = '解錠しています…';
  let code;
  try { code = await decryptTwin(pw); }
  catch (e) {
    if (!silent) { if (msg) msg.textContent = 'パスワードが違います'; }
    else { try { localStorage.removeItem(TWIN_PW_KEY); } catch (_) {} }
    return false;
  }
  if (!twinUnlocked()) {
    const el = document.createElement('script');
    el.textContent = code;
    document.body.appendChild(el);
  }
  try { localStorage.setItem(TWIN_PW_KEY, pw); } catch (_) {}
  const panel = document.getElementById('panel-twin');
  if (panel && window.CUR_KEY) {
    panel.innerHTML = renderTwin(window.CUR_KEY);
    if (document.getElementById('pairMonth')) fillPairDays();
  }
  return true;
}

function submitTwinLock() {
  const input = document.getElementById('twinLockInput');
  unlockTwin(input ? input.value.trim() : '', false);
}

function renderTwinLocked() {
  return card('🔒', 'ツインレイ診断', '限定公開の機能です',
    `<p>ツインレイ診断は、パスワードをお持ちの方だけが使える限定機能です。あなたと響き合う魂の誕生日を、5つの型と366日のカレンダーで読み解きます。</p>
     <div class="lock-form">
       <input id="twinLockInput" class="lock-input" type="password" autocomplete="current-password" placeholder="パスワード" aria-label="パスワード"
         onkeydown="if(event.key==='Enter'){submitTwinLock()}">
       <button class="pair-btn" onclick="submitTwinLock()">解錠する</button>
     </div>
     <p id="twinLockMsg" class="lock-msg" role="status"></p>
     <div class="sub-head">パスワードをお持ちでない方へ</div>
     <p>二人の生年月日と出生時刻から、転星術の型とホロスコープの相性を合わせて読み解く「ツインレイ総合鑑定」も受け付けています。</p>
     <div style="margin-top:14px"><a class="pair-btn" href="https://mond.how/9ren_azusa" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">ツインレイ総合鑑定を依頼する（8,000円）</a></div>`);
}

// 保存済みパスワードがあれば自動で解錠
try { const saved = localStorage.getItem(TWIN_PW_KEY); if (saved) unlockTwin(saved, true); } catch (_) {}

// ══════════════════════════════════════════════════════════════
// Xシェア
// ══════════════════════════════════════════════════════════════
const SHARE_URL = 'https://9renazusa.github.io/tenseijutsu/';
const SHARE_TAGS = '#転星術';

function openShare(text) {
  const u = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text + '\n' + SHARE_TAGS) +
            '&url=' + encodeURIComponent(SHARE_URL);
  window.open(u, '_blank', 'noopener');
}

function shareMain() {
  const me = DATA[window.CUR_KEY];
  const rv = PLANET_INFO[me.root] ? PLANET_INFO[me.root].virtue : '';
  const av = PLANET_INFO[me.active].virtue;
  openShare(me.root
    ? `私の転星術は「${me.root}×${me.active}」。前世は${rv}の魂、今世は${av}の力が目覚める型でした。\nあなたの前世のチャクラは？`
    : `私の転星術のアクティブチャクラは「${me.active}」。今世は${av}の力が目覚める型でした。\nあなたの前世のチャクラは？`);
}

function shareTwin() {
  const tops = window.TWIN_TOPS || [];
  const head = tops.slice(0, 2).map(fmtKey).join('・');
  const me = DATA[window.CUR_KEY];
  openShare(tops.length
    ? `私のツインレイの誕生日は、${head}${tops.length > 2 ? `など${tops.length}日` : ''}。対極のツインレイは「${mirrorOf(me.active)}×${mirrorOf(me.root)}」の人でした。\nあなたのツインレイの誕生日は？ #ツインレイ`
    : `転星術でツインレイ診断をしてみました。\nあなたのツインレイの誕生日は？ #ツインレイ`);
}

function sharePair(otherKey) {
  const ms = twinMatch(DATA[window.CUR_KEY], DATA[otherKey]);
  const score = twinScore(ms);
  const names = ms.map(m => TWIN_BY_ID[m.id].name).join('・');
  openShare(`${fmtKey(otherKey)}生まれの人とのツインレイ度は${score}（${twinLevel(score)}縁）。${names}でした。\nあなたとあの人の相性は？ #ツインレイ`);
}

function twinLevel(score) {
  return score >= 7 ? '極めて深い' : score >= 5 ? '深い' : score >= 3 ? '確かな' : 'ゆるやかな';
}

function shareCurrent() {
  const tw = document.getElementById('panel-twin');
  if (tw && tw.classList.contains('on') && twinUnlocked()) shareTwin(); else shareMain();
}

function shareButton(onclick, label) {
  return `<button class="share-btn" onclick="${onclick}"><span class="share-x" aria-hidden="true">𝕏</span>${label}</button>`;
}

// ── 診断 ─────────────────────────────────────────────────────
const TABS = [
  { id:'past',     name:'前世',       hint:'メインチャクラ' },
  { id:'mission',  name:'使命と才能', hint:'アクティブ' },
  { id:'fate',     name:'運命',       hint:'アクティブ' },
  { id:'relation', name:'人間関係',   hint:'アクティブ' },
  { id:'twin',     name:'ツインレイ', hint:'相性' },
];

function card(icon, label, title, body, chips) {
  return `
    <div class="section-card">
      <div class="section-label">
        <span class="section-label-icon">${icon}</span>
        <span class="section-label-text">${label}</span>
      </div>
      <div class="section-title">${title}</div>
      <div class="section-body">${body}</div>
      ${chips && chips.length ? `<div class="virtue-grid">${chips.map(v=>`<span class="virtue-chip">${v}</span>`).join('')}</div>` : ''}
    </div>`;
}

function sub(head, text) {
  return `<div class="sub-head">${head}</div><p>${text}</p>`;
}

function profileBlock(planet) {
  const pp = PLANET_PROFILE[planet];
  if (!pp) return '';
  return sub('長所', pp.strength) + sub('陥りやすい点', pp.weak) + sub('学び', pp.lesson);
}

function switchTab(id) {
  document.querySelectorAll('.reading-tab').forEach(b => {
    const on = b.dataset.tab === id;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', on);
  });
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('on', p.id === `panel-${id}`));
}

function divine() {
  const m = monthSelect.value;
  const d = daySelect.value;
  const key = `${m}/${d}`;
  const info = DATA[key];

  if(!info) {
    alert('この日付のデータが見つかりません');
    return;
  }

  document.getElementById('inputSection').style.display = 'none';

  const mNum = parseInt(m), dNum = parseInt(d);
  document.getElementById('resultDate').textContent = `${mNum}月${dNum}日生まれ`;
  document.getElementById('resultZodiac').textContent = info.zodiac;

  // チャクラ図
  const diagram = document.getElementById('chakraDiagram');
  diagram.innerHTML = '';
  const planets = ['木星','水星','月','金星','太陽','土星','火星'];
  planets.forEach(p => {
    const isActive = p === info.active;
    const isRoot = p === info.root;
    const pInfo = PLANET_INFO[p];
    const div = document.createElement('div');
    div.className = 'chakra-item' + (isActive ? ' active-chakra' : isRoot ? ' main-chakra' : '');
    div.innerHTML = `
      <div class="chakra-orb ${isActive?'active':isRoot?'main':'none'}">${pInfo.symbol}</div>
      <div class="chakra-info">
        <div class="chakra-planet-name">${p}</div>
        <div class="chakra-type-label">${pInfo.virtue}のチャクラ</div>
      </div>
      ${isActive ? '<span class="chakra-tag tag-active">アクティブチャクラ</span>' : isRoot ? '<span class="chakra-tag tag-main">メインチャクラ</span>' : ''}
    `;
    diagram.appendChild(div);
  });

  const root = info.root;
  const active = info.active;
  const rootInfo = PLANET_INFO[root] || {};
  const activeInfo = PLANET_INFO[active] || {};

  // ── 前世タブ ──
  let past = '';
  if (root && PAST_LIFE[root]) {
    const pl = PAST_LIFE[root];
    past += card('🌌', 'メインチャクラ', `${root} ── ${rootInfo.virtue}の魂`,
      `<p>あなたのメインチャクラは<span class="highlight">「${root}」</span>です。${rootInfo.desc || ''}</p><p>${ROOT_TEXT[root] || ''}</p>`,
      PLANET_PROFILE[root].keywords);
    const variant = getPastVariant(root, active);
    past += card('📜', '前世の姿', '魂が歩んできた道',
      sub('前世の基本像', pl.image) +
      sub('想定される活動', pl.work) +
      (variant ? sub(`${active}チャクラが加える色合い`, variant) : '') +
      (pl.alt ? sub('もう一つの可能性', pl.alt) : '') +
      sub('前世で身につけたもの', pl.gained) +
      sub('前世から持ち越した課題', pl.issue),
      ['前世の徳：' + rootInfo.virtue]);
    past += card(rootInfo.symbol, `${root}の基本テーマ`, '魂の土台となる性質', profileBlock(root));
  } else {
    past += card('🌌', 'メインチャクラ', 'メインチャクラは未確定です',
      `<p>この日付はメインチャクラのデータが登録されていません。アクティブチャクラ（${active}）の鑑定のみ表示しています。</p>`);
  }

  // ── 使命と才能タブ ──
  const ms = MISSION[active] || {};
  let mission = '';
  mission += card('⚡', 'アクティブチャクラ', `${active} ── ${activeInfo.virtue}の力が目覚める`,
    `<p>メインチャクラのエネルギーを受けて目覚めるアクティブチャクラは<span class="highlight">「${active}」</span>です。${activeInfo.desc || ''}</p>` +
    (root ? `<p>${getActiveKey(root, active)}</p>` : ''),
    PLANET_PROFILE[active].keywords);
  mission += card('🜂', '使命と才能', '今世で伸ばす力',
    sub('現世の性格', ms.nature) +
    sub('使命・才能を活かせる分野', ms.fields) +
    sub('現世で学ぶこと', ms.learn),
    ['現世の使命', '磨くべき才能']);
  mission += card(activeInfo.symbol, `${active}の基本テーマ`, '才能の光と影', profileBlock(active));

  // ── 運命タブ ──
  const ft = FATE[active] || {};
  let fate = '';
  fate += card('☄', '運命', `${active}型の運命`,
    `<p>この鑑定では、人生の出来事を「罰」ではなく、魂が成長するために用意した経験として読みます。苦労が多いことは、それだけで悪い運命を意味しません。</p>` +
    sub('人生の傾向', ft.text) +
    sub('運命の課題', ft.theme),
    (ft.virtues || []).map(v => `学ぶ徳：${v}`));
  fate += card('✦', '魂が学ぶべき徳', '今世のテーマ',
    `<p>${root ? `${root}の徳「${rootInfo.virtue}」を土台に、` : ''}${active}の徳「${activeInfo.virtue}」を発揮しながら、あなたはこの現世で魂を成長させていきます。</p>` +
    `<p>${active}が補うべき徳は<span class="highlight">「${(ft.virtues||[]).join('」「')}」</span>。この徳を意識して経験を重ねることが、運命の意味を受け取ることにつながります。</p>` +
    (root && FATE[root] && root !== active ? `<p>また、メインチャクラの${root}からは「${FATE[root].theme}」という課題も引き継いでいます。</p>` : ''),
    [`発揮する徳：${activeInfo.virtue}`, ...(root ? [`土台の徳：${rootInfo.virtue}`] : [])]);

  // ── 人間関係タブ ──
  const rl = RELATION[active] || {};
  let relation = '';
  relation += card('🤝', '人間関係', '出会いが運ぶ学び',
    `<p>この鑑定では、人間関係を相性の良し悪しだけで判断しません。合わない相手との関係からも、自分に足りない徳を学ぶ意味があると考えます。</p>` +
    sub('出会いやすい人物', rl.meet) +
    sub('関係の特徴', rl.feature) +
    sub('相手から学ぶこと', rl.learn),
    VIRTUE_LEARN[active] || []);
  relation += card('♡', '恋愛・結婚', `${active}チャクラの恋愛傾向`,
    `<p>${rl.love}</p>` +
    `<div class="sub-head">すべての人に共通するテーマ</div><ul class="love-list">${LOVE_COMMON.map(t=>`<li>${t}</li>`).join('')}</ul>`);

  // ── タブ組み立て ──
  window.CUR_KEY = key;
  const panels = { past, mission, fate, relation, twin: twinUnlocked() ? renderTwin(key) : renderTwinLocked() };
  const cards = document.getElementById('resultCards');
  cards.innerHTML = `
    <div class="reading-tabs" role="tablist">
      ${TABS.map((t,i)=>`<button class="reading-tab${i===0?' on':''}" role="tab" aria-selected="${i===0}" data-tab="${t.id}" onclick="switchTab('${t.id}')">${t.name}<small>${t.hint}</small></button>`).join('')}
    </div>
    ${TABS.map((t,i)=>`<div class="tab-panel${i===0?' on':''}" id="panel-${t.id}" role="tabpanel">${panels[t.id]}</div>`).join('')}
    <div class="share-bar">${shareButton('shareCurrent()', '結果をXでシェア')}<p class="share-note">いま開いているタブの結果をシェアします</p></div>
    ${card('☯', '鑑定の読み方', '前世を「当てる」ためではなく',
      `<div class="core-flow">
        <p>いまの性格や才能には、過去から持ち越したものがある。</p>
        <p>けれど魂は、まったく同じ状態で生まれ変わるわけではない。</p>
        <p>今世には、まだ身についていない徳を学ぶための経験が用意されている。</p>
        <p>だから苦労にも、人間関係にも、恋愛や仕事の出来事にも成長の意味がある。</p>
      </div>
      <p>大切なのは出来事を避けることではなく、そこから何を学ぶか。「どんな運命か」だけでなく、<span class="highlight">何を学び、どの才能をどう使い、誰との関係が成長につながるのか</span>まで受け取ってください。</p>`)}
    ${card('✉', '個別鑑定', 'あなた専用の診断と処方を', 
      `<p>この結果は誕生日だけから読んだ「型」です。生まれた年・時刻やホロスコープ全体を合わせると、前世から持ち越した課題と、今世でそれをどう活かすかを、もっと具体的にお伝えできます。</p>
      <p>「なぜそうなっているか」の診断と、「どうすればいいか」の処方を、両方お出しします。</p>
      <div style="margin-top:24px"><a class="btn-divine" href="https://mond.how/9ren_azusa" target="_blank" rel="noopener">九蓮梓に鑑定を依頼する</a></div>`)}
    <p class="source-note">転生・カルマ・チャクラの考え方は、科学的に実証された事実として示すものではありません。</p>
  `;

  if (document.getElementById('pairMonth')) fillPairDays();
  const resultSection = document.getElementById('resultSection');
  resultSection.classList.add('visible');
  window.scrollTo({top:0, behavior:'smooth'});
}

function reset() {
  document.getElementById('resultSection').classList.remove('visible');
  document.getElementById('inputSection').style.display = '';
  window.scrollTo({top:0, behavior:'smooth'});
}
